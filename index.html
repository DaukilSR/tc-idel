function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function open_(pw,silent){
  var b=document.getElementById("go");b.disabled=true;b.textContent="Открываю…";
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c));
  }).then(function(buf){
    try{if(document.getElementById("rm").checked)localStorage.setItem("idel.pw",pw);}catch(e){}
    var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close();
  }).catch(function(){
    try{localStorage.removeItem("idel.pw");}catch(e){}
    b.disabled=false;b.textContent="Открыть";if(!silent)document.getElementById("err").textContent="Неверный пароль.";
  });
}
document.getElementById("f").onsubmit=function(e){e.preventDefault();open_(document.getElementById("pw").value,false);};
